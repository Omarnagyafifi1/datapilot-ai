name: Build & Deploy to Azure

on:
  push:
    branches: [main, DEPLOYMENT]
  workflow_dispatch:

env:
  AZURE_CONTAINER_APP: ca-datapilot
  AZURE_RESOURCE_GROUP: datapilot-rg
  ACR: datapilotacr.azurecr.io
  IMAGE_NAME: datapilot-ai

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Lint Python
        run: ruff check backend/app/ --no-fix || true

      - name: Run backend tests
        run: pytest backend/final_test/ -v --tb=short || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend deps
        run: npm install --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend || true

      - name: Build frontend
        run: npm run build --prefix frontend || true

  build-deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.ACR }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Container App
        run: |
          az containerapp update --name ${{ env.AZURE_CONTAINER_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
