name: Build & Deploy to Azure

on:
  push:
    branches: [main, DEPLOYMENT]
  workflow_dispatch:

env:
  AZURE_CONTAINER_APP: ca-datapilot
  AZURE_RESOURCE_GROUP: datapilot-rg
  ACR: datapilotacr.azurecr.io
  IMAGE_NAME: datapilot-ai

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.ACR }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Container App
        run: |
          az containerapp update --name ${{ env.AZURE_CONTAINER_APP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
