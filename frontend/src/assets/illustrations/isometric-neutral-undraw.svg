<!-- Generated neutral isometric illustration (original) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="soft" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0f1724" />

  <g transform="translate(80,40)">
    <!-- platform -->
    <polygon points="60,0 360,0 420,80 120,80" fill="#0b1b2a" />
    <polygon points="60,0 120,80 0,80  -60,0" fill="#0c1f2e" opacity="0.95" transform="translate(60,0)" />

    <!-- server block -->
    <g transform="translate(160,20)">
      <rect x="0" y="0" width="96" height="56" rx="8" fill="#06121a" />
      <rect x="8" y="8" width="80" height="40" rx="6" fill="#1f6f8b" />
    </g>

    <!-- laptop -->
    <g transform="translate(40,120)">
      <rect x="0" y="0" width="140" height="10" rx="3" fill="#021219" />
      <rect x="8" y="-58" width="124" height="48" rx="6" fill="#0e2730" />
      <rect x="14" y="-52" width="108" height="32" rx="4" fill="#cfeff6" opacity="0.06" />
    </g>
  </g>

  <rect x="40" y="20" width="480" height="260" rx="12" fill="url(#soft)" />
</svg>

