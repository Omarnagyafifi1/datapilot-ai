<!-- Generated isometric neon purple illustration (original) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="neonA" x1="0" x2="1">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#d946ef" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0a0212" />

  <!-- isometric pillars -->
  <g transform="translate(80,30)">
    <g transform="translate(40,40)">
      <polygon points="0,0 60,-30 120,0 60,30" fill="#070015" />
      <polygon points="60,-30 120,0 120,80 60,50" fill="#16002b" />
    </g>

    <g transform="translate(220,20)">
      <rect x="0" y="0" width="120" height="60" rx="8" fill="#0b0411" />
      <rect x="12" y="10" width="96" height="40" rx="6" fill="url(#neonA)" filter="url(#glow)" />
    </g>

    <!-- floating cubes -->
    <g transform="translate(140,110)">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="#1b0423" />
      <rect x="6" y="6" width="28" height="28" rx="3" fill="#a78bfa" opacity="0.95" />
    </g>
  </g>

  <!-- neon nodes -->
  <g fill="#d946ef" opacity="0.9">
    <circle cx="420" cy="80" r="5" />
    <circle cx="460" cy="120" r="4" />
    <circle cx="480" cy="60" r="3" />
  </g>

  <!-- subtle grid lines -->
  <g opacity="0.04" stroke="#fff">
    <line x1="20" y1="260" x2="540" y2="260" />
  </g>
</svg>

