
services:
  # ── Production simulation (with PostgreSQL) ─────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: datapilot-pg
    profiles: ["prod"]
    environment:
      POSTGRES_DB: datapilot
      POSTGRES_USER: datapilot
      POSTGRES_PASSWORD: datapilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datapilot-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datapilot-ai-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-5-mini}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-datapilot-ai}
      - DATABASE_URL=postgresql+psycopg2://datapilot:datapilot@postgres:5432/datapilot
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - datapilot-data:/app/backend/data
      - datapilot-uploads:/app/backend/uploads
    restart: unless-stopped
    networks:
      - datapilot-network
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["prod"]

  # ── Development (SQLite, default) ───────────────────────────────────
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datapilot-ai-backend-dev
    profiles: ["dev"]
    ports:
      - "8000:8000"
    command: >
      sh -c "python /app/backend/scripts/setup_demo_db.py || true; uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-5-mini}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-YSSM7OdRq3eqDgl-QT3fE7yQUMIsc5tuYKk9louIgLY=}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-datapilot-ai}
      - DATABASE_URL=sqlite+aiosqlite:///./dev.db
    volumes:
      - datapilot-data:/app/backend/data
    restart: unless-stopped
    networks:
      - datapilot-network

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: datapilot-ai-frontend
    profiles: ["dev"]
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend-dev:8000
    restart: unless-stopped
    networks:
      - datapilot-network
    depends_on:
      backend-dev:
        condition: service_started

volumes:
  datapilot-data:
  datapilot-uploads:
  pgdata:

networks:
  datapilot-network:
    driver: bridge
