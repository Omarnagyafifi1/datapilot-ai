version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datapilot-ai-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=groq
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - DATABASE_URL=sqlite+aiosqlite:///./dev.db
      - DATA_SOURCES_DB_URL=sqlite:///./data_sources.db
      - QUERY_HISTORY_DB_URL=sqlite:///./query_history.db
    volumes:
      # Persistent storage volume for SQLite metadata and databases
      - datapilot-data:/app/backend/data
    restart: unless-stopped
    networks:
      - datapilot-network

  frontend-dev:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: datapilot-ai-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:8000
    volumes:
      # Mount source for hot-reload (optional, uncomment for live editing)
      # - ./frontend/src:/app/frontend/src
      # - ./frontend/public:/app/frontend/public
    restart: unless-stopped
    networks:
      - datapilot-network
    depends_on:
      - backend

volumes:
  datapilot-data:

networks:
  datapilot-network:
    driver: bridge