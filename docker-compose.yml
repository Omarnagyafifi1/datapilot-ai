version: "3.8"

services:
  # ── Production simulation (with PostgreSQL) ─────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: datapilot-pg
    profiles: ["prod"]
    environment:
      POSTGRES_DB: datapilot
      POSTGRES_USER: datapilot
      POSTGRES_PASSWORD: datapilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datapilot-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datapilot-ai-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=groq
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # Use PostgreSQL when running with --profile prod
      - DATABASE_URL=postgresql+psycopg2://datapilot:datapilot@postgres:5432/datapilot
      - DATA_SOURCES_DB_URL=sqlite:///./data_sources.db
      - QUERY_HISTORY_DB_URL=sqlite:///./query_history.db
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - datapilot-data:/app/backend/data
      - datapilot-uploads:/app/backend/uploads
    restart: unless-stopped
    networks:
      - datapilot-network
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    profiles: ["prod"]

  # ── Development (SQLite, default) ───────────────────────────────────
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datapilot-ai-backend-dev
    profiles: ["dev"]
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=groq
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - DATABASE_URL=sqlite+aiosqlite:///./dev.db
      - DATA_SOURCES_DB_URL=sqlite:///./data_sources.db
      - QUERY_HISTORY_DB_URL=sqlite:///./query_history.db
    volumes:
      - datapilot-data:/app/backend/data
    restart: unless-stopped
    networks:
      - datapilot-network

  frontend-dev:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: datapilot-ai-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend-dev:8000
    restart: unless-stopped
    networks:
      - datapilot-network
    depends_on:
      backend-dev:
        condition: service_started

volumes:
  datapilot-data:
  datapilot-uploads:
  pgdata:

networks:
  datapilot-network:
    driver: bridge