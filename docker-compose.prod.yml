version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: datapilot-ai:latest
    container_name: datapilot-ai-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./dev.db}
      - DATA_SOURCES_DB_URL=${DATA_SOURCES_DB_URL:-sqlite:///./data_sources.db}
      - QUERY_HISTORY_DB_URL=${QUERY_HISTORY_DB_URL:-sqlite:///./query_history.db}
      - ALLOW_ORIGINS=${ALLOW_ORIGINS:-http://localhost:5173}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DEBUG=false
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-datapilot-ai}
      - APPLICATIONINSIGHTS_CONNECTION_STRING=${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    volumes:
      - datapilot-data:/app/backend/data
      - datapilot-uploads:/app/backend/uploads
    restart: unless-stopped
    networks:
      - datapilot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: datapilot-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - datapilot-network

volumes:
  datapilot-data:
  datapilot-uploads:
  redis-data:

networks:
  datapilot-network:
    driver: bridge
